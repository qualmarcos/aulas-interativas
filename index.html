<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas Interativas · Intercultura</title>
<meta name="description" content="Aulas interativas de português da Intercultura Costa Rica, Heredia.">
<meta name="theme-color" content="#0d5a3a">
<link rel="icon" href="marca/emblema.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0d5a3a;--verde2:#1f8f4e;--lima:#a5c21b;--lima2:#c9dc4a;
  --bg:#f3f6f1;--card:#fff;--ink:#16261d;--muted:#5b6b62;--line:#dbe4dc;--soft:#eef4ea;
  --nab1:#006b4f;--nab2:#145da1;--nab3:#6b4598;--via1:#a6462d;--jogos:#c26a00;--modulos:#0d5a3a;--papo:#c2185b;
  --larg:none;--gut:clamp(16px,3.5vw,80px);--sombra:0 10px 30px rgba(13,58,40,.10);--sombra2:0 18px 40px rgba(13,58,40,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block}

/* ---------- Capa ---------- */
header{position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(165,194,27,.35),transparent 60%),
             radial-gradient(900px 600px at -10% 120%,rgba(31,143,78,.55),transparent 60%),
             linear-gradient(135deg,#0a4a30 0%,#0d5a3a 45%,#16784a 100%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:70px;background:var(--bg);
  clip-path:ellipse(75% 100% at 50% 100%)}
.faixa{position:absolute;top:0;bottom:0;right:0;width:clamp(70px,13vw,190px);
  background:url(marca/faixa.jpg) center top/100% auto repeat-y;opacity:.9;
  -webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%)}
.topo{position:relative;z-index:2;max-width:var(--larg);margin:0 auto;padding:22px var(--gut) 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topo img{height:clamp(38px,6vw,54px);width:auto}
.hero{position:relative;z-index:2;max-width:var(--larg);margin:0 auto;padding:26px var(--gut) 110px;
  display:grid;grid-template-columns:1.25fr .9fr;align-items:center;gap:32px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--lima2);box-shadow:0 0 0 4px rgba(201,220,74,.25)}
h1{margin:18px 0 12px;font-size:clamp(38px,6vw,96px);line-height:1;font-weight:900;letter-spacing:-.02em}
h1 span{display:block;color:var(--lima2)}
.lead{margin:0;max-width:40ch;font-size:clamp(17px,2vw,20px);line-height:1.5;color:rgba(255,255,255,.88)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 16px;min-width:104px;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.05}
.stat small{font-size:13px;color:rgba(255,255,255,.78);font-weight:700}
.selo{position:relative;justify-self:center;width:clamp(260px,28vw,480px);aspect-ratio:1}
.selo::before{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px dashed rgba(201,220,74,.45);animation:gira 60s linear infinite}
.selo .disco{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.28),inset 0 0 0 10px #f2f7e6;display:grid;place-items:center}
.selo img{width:84%;height:auto;animation:flutua 6s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes flutua{50%{transform:translateY(-6px)}}
#bTema{position:relative;z-index:3;font:inherit;font-size:18px;background:rgba(6,40,26,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:7px 11px;cursor:pointer}
#bTema:hover{background:rgba(255,255,255,.24)}

/* ---------- Níveis ---------- */
main{position:relative;z-index:3;max-width:var(--larg);margin:-86px auto 40px;padding:0 var(--gut)}
.niveis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nivel{--c:var(--verde);position:relative;overflow:hidden;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--card);border:2px solid transparent;border-radius:20px;padding:18px 18px 16px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;gap:2px;transition:transform .18s,box-shadow .18s,border-color .18s}
.nivel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.nivel:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.nivel:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
.nivel .n{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nivel .t{font-size:26px;font-weight:900;color:var(--c);line-height:1.1}
.nivel .q{font-size:14px;font-weight:700;color:var(--muted)}
.nivel .num{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:44px;font-weight:900;color:var(--c);opacity:.13}
.nivel.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 16px 34px color-mix(in srgb,var(--c) 40%,transparent)}
.nivel.on .n,.nivel.on .q{color:rgba(255,255,255,.82)}
.nivel.on .t{color:#fff}
.nivel.on .num{color:#fff;opacity:.22}
.nivel.on::before{background:rgba(255,255,255,.35)}

.barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 18px}
.barra h2{margin:0;font-size:clamp(22px,3vw,28px);font-weight:900}
.barra h2 small{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
.busca{position:relative;width:min(360px,100%)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.busca input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;outline:none;transition:border-color .15s}
.busca input:focus{border-color:var(--verde2)}

/* ---------- Cartões ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{--c:var(--verde);background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s;animation:entra .35s both}
.card:hover{transform:translateY(-5px);box-shadow:var(--sombra2)}
.card:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.card .pic{height:168px;background:#cfd8cf center/cover no-repeat;position:relative}
.card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35))}
.card .tag{position:absolute;z-index:1;left:12px;top:12px;background:var(--c);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.card .rev{position:absolute;z-index:1;right:12px;bottom:12px;background:#fff;color:var(--c);font-weight:900;font-size:11px;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;border-top:4px solid var(--c)}
.card h3{margin:0;font-size:20px;font-weight:900;line-height:1.2}
.card .sub{color:var(--c);font-weight:800}
.card .gram{color:var(--muted);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card .chips span{background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.card .go{margin-top:auto;padding-top:12px;font-weight:900;color:var(--c);display:flex;align-items:center;gap:6px}
.card .go b{transition:transform .18s}
.card:hover .go b{transform:translateX(4px)}
.grupo+.grupo{margin-top:38px}
.gt{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:20px;font-weight:900;color:var(--ink)}
.gt span{font-size:22px}
.gt small{font-size:13px;font-weight:800;background:var(--soft);color:var(--muted);border-radius:999px;padding:2px 10px}
.gt::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.empty{text-align:center;color:var(--muted);display:none;padding:30px 0;font-weight:700}

footer{max-width:var(--larg);margin:0 auto;padding:30px var(--gut) 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer img{height:40px;width:auto}
footer .logo-b{display:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;text-align:center;padding-bottom:100px}
  .lead{margin:0 auto}.stats{justify-content:center}
  .selo{grid-row:1;width:min(220px,58vw)}
  .niveis{grid-template-columns:repeat(2,1fr)}
  .faixa{opacity:.35}
}
@media (max-width:420px){.nivel .t{font-size:22px}.nivel .num{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ---------- Seções (tela inicial) ---------- */
.secoes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.secao{--c:var(--verde);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:26px 26px 22px;min-height:230px;border-radius:24px;
  background:var(--card);color:var(--ink);text-decoration:none;box-shadow:var(--sombra);border-top:8px solid var(--c);transition:transform .18s,box-shadow .18s}
.secao:hover{transform:translateY(-5px);box-shadow:var(--sombra2)}
.secao[data-id="modulos"]{border-top-color:var(--lima)}
.secao:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
.secao::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:var(--c);opacity:.08}
.s-ic{font-size:46px;line-height:1;margin-bottom:6px}
.s-leg{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.s-nome{font-size:clamp(26px,2.4vw,34px);font-weight:900;color:var(--c);line-height:1.1}
.s-desc{font-size:15px;color:var(--muted);line-height:1.45;max-width:34ch}
.s-q{margin-top:auto;padding-top:12px;font-weight:900;color:var(--c)}
.s-q b{display:inline-block;transition:transform .18s}
.secao:hover .s-q b{transform:translateX(4px)}
.voltar-row{display:none;align-items:center;gap:12px;margin-bottom:14px}
body:not([data-secao="inicio"]) .voltar-row{display:flex}
.voltar{font:inherit;font-weight:900;font-size:15px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:var(--sombra)}
.voltar:hover{border-color:var(--verde2)}
.sec-nome{font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
body:not([data-secao="modulos"]) .niveis{display:none}
body[data-secao="inicio"] .barra{margin-top:30px}
.breve{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 16px;background:var(--card);border-radius:22px;box-shadow:var(--sombra);font-size:16px}
.breve span{font-size:54px}.breve b{font-size:24px;color:var(--papo)}
@media (max-width:860px){.secoes{grid-template-columns:1fr}.secao{min-height:0}}
html[data-theme="dark"] .secao{border-top-color:var(--c)}

/* ---------- Modo escuro ---------- */
html[data-theme="dark"]{color-scheme:dark;--bg:#0e1612;--card:#17221c;--ink:#e4ede6;--muted:#9fb3a6;--line:#2b3b31;--soft:#22312a;
  --nab1:#3fbf8f;--nab2:#6aa8ea;--nab3:#b18ce6;--via1:#ec8a6b;--jogos:#f0a640;--modulos:#4cc38a;--papo:#f06292;--sombra:0 10px 30px rgba(0,0,0,.4);--sombra2:0 18px 40px rgba(0,0,0,.55)}
html[data-theme="dark"] header{background:radial-gradient(1200px 500px at 85% -10%,rgba(165,194,27,.18),transparent 60%),linear-gradient(135deg,#062a1b,#0a3d28 50%,#0f5134)}
html[data-theme="dark"] .faixa{opacity:.5}
html[data-theme="dark"] .selo .disco{background:#f4f8ee}
html[data-theme="dark"] .nivel.on{color:#0e1612}
html[data-theme="dark"] .nivel.on .t,html[data-theme="dark"] .nivel.on .num{color:#0e1612}
html[data-theme="dark"] .nivel.on .n,html[data-theme="dark"] .nivel.on .q{color:rgba(14,22,18,.75)}
html[data-theme="dark"] .card .tag{color:#0e1612}
html[data-theme="dark"] .card .rev{background:#0e1612}
html[data-theme="dark"] footer .logo-c{display:none}
html[data-theme="dark"] footer .logo-b{display:block}
</style>
<script src="tema.js?v=1"></script>
<script src="senha.js?v=1"></script>
</head>
<body>
<header>
  <div class="faixa" aria-hidden="true"></div>
  <div class="topo" data-tema>
    <img src="marca/logo-intercultura-branco.png" alt="Intercultura Costa Rica · Centro de Idiomas" width="380" height="124">
  </div>
  <div class="hero">
    <div>
      <div class="eyebrow"><i></i>Classes de Português · Heredia</div>
      <h1>Aulas <span>interativas</span></h1>
      <p class="lead">Escolha o que usar na aula: módulos, jogos ou Papo e Pipoca. Os alunos participam pelo celular com um QR.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="selo"><div class="disco"><img src="marca/emblema.png" alt="Classes de Português" width="480" height="480"></div></div>
  </div>
</header>
<main>
  <div class="voltar-row" id="voltarRow"><button class="voltar" id="voltar">← Início</button></div>
  <div class="secoes" id="secoes" aria-label="Seções"></div>
  <div class="niveis" id="tabs" role="tablist" aria-label="Níveis"></div>
  <div class="barra">
    <h2 id="titulo">Aulas</h2>
    <label class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Buscar aula, jogo ou tema…" aria-label="Buscar">
    </label>
  </div>
  <div id="grid"></div>
  <div class="empty" id="empty">Nenhuma aula encontrada.</div>
</main>
<footer>
  <div>
    <img class="logo-c" src="marca/logo-intercultura-cor.png" alt="Intercultura Costa Rica" width="236" height="76">
    <img class="logo-b" src="marca/logo-intercultura-branco.png" alt="Intercultura Costa Rica" width="380" height="124">
  </div>
  <div>www.interculturaheredia.com</div>
</footer>
<script src="aulas-geradas.js?v=1"></script>
<script>
const AULAS = (window.AULAS_GERADAS || []).concat([
  { dir: "nab3-unidade5/", level: "nab3", unit: 5, tag: "NAB3 · Unidade 5", title: "Escolhas, contas e boas conversas",
    sub: "🧺 Dinheiro, orçamento e a Paraíba", img: "nab3-unidade5/img/mercado.jpg",
    gram: "Ler valores em reais · Cédulas e fauna · Orçamento · Conectores com subjuntivo: caso, contanto que, para que, embora, antes que, até que, sem que · Procuro alguém que…",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Artesanato", "Forca", "Equipes"] },
  { dir: "nab3-unidade4/", level: "nab3", unit: 4, tag: "NAB3 · Unidade 4", title: "O tempo muda, a conversa continua",
    sub: "🌦️ Tempo, planos e o Amapá", img: "nab3-unidade4/img/marabaixo.jpg",
    gram: "Tempo × clima · Faz calor, está nublado, chove · Preferência e desejo · É possível que… / É importante que… + subjuntivo",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Marabaixo", "Forca", "Equipes"] },
  { dir: "via-brasil1-unidade2/", level: "via1", unit: 2, tag: "VIA Brasil 1 · Unidade 2", title: "Mensagens, desejos e jeitos de dizer",
    sub: "💬 Interjeições, subjuntivo e expressões", img: "via-brasil1-unidade2/img/celular.jpg",
    gram: "Presente e imperfeito do subjuntivo · Colocação pronominal · Formação de palavras · Superlativo · Regência · Sons do X",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Forca", "Equipes"] },
  { dir: "jogos-forca/", level: "jogos", unit: 1, tag: "Jogos · Forca", title: "Jogo da forca",
    sub: "🎯 3 bancos · 24 categorias", img: "jogos-forca/img/forca.svg",
    gram: "Primeiras palavras (NAB1–NAB2): animais, frutas, cores, família, corpo, roupas, casa, profissões · Dia a dia (NAB2–NAB3): cidade, transportes, clima, esportes, sentimentos, rotina, tecnologia, saúde · Brasil: estados, capitais, comidas, animais, música, natureza",
    chips: ["📱 Sala com QR", "Forca", "Roleta", "Equipes"] },
  { dir: "jogos-verdadeiro-falso/", level: "jogos", unit: 2, tag: "Jogos · Verdadeiro ou falso", title: "Verdadeiro ou falso?",
    sub: "✅ 6 categorias · 60 frases", img: "jogos-verdadeiro-falso/img/vf.svg",
    gram: "Brasil: geografia · cultura e costumes · Língua portuguesa: gramática básica (NAB1–NAB2) · falsos amigos português × espanhol · gramática intermediária (NAB3) · Expressões idiomáticas (VIA)",
    chips: ["📱 Sala com QR", "Explicações", "Roleta", "Equipes"] },
  { dir: "papo-todo-dia/", level: "papo", unit: 1, tag: "Papo e Pipoca", title: "Todo dia é dia de papo",
    sub: "💬 306 assuntos · 17 categorias", img: "papo-todo-dia/img/papo.svg",
    gram: "Dia a dia · Família e amigos · Comida e bebida · Viagens · Cinema e séries · Música e artes · Esporte e saúde · Lazer · Trabalho e estudos · Tecnologia · Natureza · Cidade · Brasil e culturas · Memórias · Imagine se… · Opinião e debate · Dinheiro e consumo",
    chips: ["🎲 Sorteio", "Perguntas uma a uma", "Todos os níveis"] },
  { dir: "papo-filmes/", level: "papo", unit: 2, tag: "Papo e Pipoca", title: "Sessão Pipoca",
    sub: "🎬 32 filmes brasileiros para conversar", img: "papo-filmes/img/sessao.svg",
    gram: "Comédia · Drama · Família e animação · Música e biografia · Clássicos · Ação e suspense · Documentário · Central do Brasil, O Auto da Compadecida, Que Horas Ela Volta?, Ainda Estou Aqui, Cidade de Deus, Minha Mãe é uma Peça…",
    chips: ["🎬 Sorteio", "Antes e depois", "Palavras", "Trailer"] },
  { dir: "nab2-unidade3/", level: "nab2", unit: 3, tag: "NAB2 · Unidade 3", title: "Escolhas que vestem o futuro",
    sub: "🧳 Roupas, compras e planos", img: "nab2-unidade3/img/mala.jpg",
    gram: "Futuro do presente · Futuro do pretérito · Verbos vestir, pôr, ir e vir",
    chips: ["📱 Sala com QR", "Galeria", "Memória", "Forca", "Equipes"] },
]);
/* Seções da tela inicial: Módulos (aulas por nível), Jogos e Papo e Pipoca.
   Cada item de AULAS tem "level": nab1/nab2/nab3/via1 (Módulos), "jogos" ou "papo". */
const SECOES = [
  { id: "modulos", nome: "Módulos", leg: "Aulas por nível", ic: "📚", desc: "As unidades e revisões de NAB1, NAB2, NAB3 e VIA Brasil.", cor: "modulos" },
  { id: "jogos", nome: "Jogos", leg: "Todos os níveis", ic: "🎲", desc: "Forca, verdadeiro ou falso e outros jogos para revisar em equipes.", cor: "jogos" },
  { id: "papo", nome: "Papo e Pipoca", leg: "Conversa e cinema", ic: "🍿", desc: "Encontros de conversa com temas, vídeos e debates.", cor: "papo" },
];
const NIVEIS = [["nab1", "NAB1", "Nível 1"], ["nab2", "NAB2", "Nível 2"], ["nab3", "NAB3", "Nível 3"], ["via1", "VIA 1", "VIA Brasil"]];
const KEY = "aulas-nivel", ids = NIVEIS.map(n => n[0]);
const $ = id => document.getElementById(id);
const grid = $("grid"), q = $("q"), tabs = $("tabs");
const secaoDe = a => ids.includes(a.level) ? "modulos" : a.level;
const count = id => AULAS.filter(a => a.level === id).length;
const nSec = id => AULAS.filter(a => secaoDe(a) === id).length;
const isRev = a => /Revis/.test(a.tag);
const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const PAL = { modulos: ["aula", "aulas"], jogos: ["jogo", "jogos"], papo: ["encontro", "encontros"] };
const stat = (n, t) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`;
$("stats").innerHTML = stat(nSec("modulos"), "aulas") + stat(nSec("jogos"), "jogos") + stat(NIVEIS.length, "níveis");
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
let nivel = ids.includes(saved) ? saved : ids[0], secao = null;
function lerHash() {
  const h = location.hash.slice(1);
  if (ids.includes(h)) { secao = "modulos"; nivel = h; }
  else secao = SECOES.some(s => s.id === h) ? h : null;
}
function ir(hash) { q.value = ""; if (location.hash.slice(1) !== hash) history.pushState(null, "", hash ? "#" + hash : location.pathname); lerHash(); paint(); scrollTo({ top: secao ? document.querySelector("main").offsetTop - 120 : 0, behavior: "smooth" }); }
function choose(id) { nivel = id; try { localStorage.setItem(KEY, id); } catch (e) {} q.value = ""; history.replaceState(null, "", "#" + id); paint(); }
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const card = (a, i) => `<a class="card" href="${a.dir}" style="--c:var(--${a.level});animation-delay:${Math.min(i, 12) * 30}ms">
    <div class="pic" style="background-image:url('${a.img}')"><span class="tag">${a.tag}</span>${isRev(a) ? '<span class="rev">Revisão</span>' : ""}</div>
    <div class="body"><h3>${a.title}</h3><div class="sub">${a.sub}</div><div class="gram">${a.gram}</div>
    <div class="chips">${a.chips.map(c => `<span>${c}</span>`).join("")}</div><div class="go">${{ jogos: "Abrir jogo", papo: "Abrir encontro" }[a.level] || "Abrir aula"} <b>→</b></div></div></a>`;
const grupo = (nome, ic, itens) => itens.length ? `<section class="grupo"><h3 class="gt"><span>${ic}</span>${nome}<small>${itens.length}</small></h3>
    <div class="grid">${itens.map(card).join("")}</div></section>` : "";
function paint() {
  const t = norm(q.value.trim()), sec = SECOES.find(s => s.id === secao);
  document.body.dataset.secao = secao || "inicio";
  $("secoes").innerHTML = secao || t ? "" : SECOES.map(s => { const n = nSec(s.id);
    return `<a class="secao" href="#${s.id}" data-id="${s.id}" style="--c:var(--${s.cor})"><span class="s-ic" aria-hidden="true">${s.ic}</span>
      <span class="s-leg">${s.leg}</span><span class="s-nome">${s.nome}</span><span class="s-desc">${s.desc}</span>
      <span class="s-q">${n ? pl(n, ...PAL[s.id]) : "Em breve"} <b>→</b></span></a>`; }).join("");
  $("secoes").querySelectorAll(".secao").forEach(x => x.onclick = e => { e.preventDefault(); ir(x.dataset.id); });
  tabs.innerHTML = secao !== "modulos" ? "" : NIVEIS.map(([id, nome, leg], i) => {
    const on = !t && id === nivel, n = count(id);
    return `<button class="nivel${on ? " on" : ""}" style="--c:var(--${id})" role="tab" aria-selected="${on}" data-id="${id}">
      <span class="n">${leg}</span><span class="t">${nome}</span><span class="q">${pl(n, "aula", "aulas")}</span><span class="num" aria-hidden="true">${i + 1}</span></button>`;
  }).join("");
  tabs.querySelectorAll(".nivel").forEach(b => b.onclick = () => choose(b.dataset.id));
  const ordem = a => SECOES.findIndex(s => s.id === secaoDe(a)) * 10 + Math.max(0, ids.indexOf(a.level));
  let list = AULAS.filter(a => t ? norm([a.tag, a.title, a.sub, a.gram, ...a.chips].join(" ")).includes(t)
      : secao === "modulos" ? a.level === nivel : secao && secaoDe(a) === secao)
    .sort((a, b) => ordem(a) - ordem(b) || a.unit - b.unit);
  const titulo = $("titulo"), nv = NIVEIS[ids.indexOf(nivel)];
  titulo.innerHTML = t ? `Resultados<small>${pl(list.length, "resultado", "resultados")}</small>`
    : secao === "modulos" ? `${nv[1]}<small>${nv[2]} · ${pl(list.length, "aula", "aulas")}</small>`
    : sec ? `${sec.ic} ${sec.nome}<small>${sec.leg} · ${list.length ? pl(list.length, ...PAL[sec.id]) : "em breve"}</small>`
    : `O que vamos fazer hoje?<small>Escolha uma seção ou busque direto</small>`;
  const de = id => list.filter(a => secaoDe(a) === id), mod = de("modulos");
  grid.innerHTML = !t && !secao ? "" : grupo("Jogos", "🎲", de("jogos")) + grupo("Papo e Pipoca", "🍿", de("papo"))
    + grupo("Unidades", "📘", mod.filter(a => !isRev(a))) + grupo("Revisões", "🔁", mod.filter(isRev));
  const empty = $("empty");
  empty.innerHTML = t ? "Nenhum resultado." : secao === "papo"
    ? `<div class="breve"><span>🍿</span><b>Em breve</b>Os encontros de Papo e Pipoca vão aparecer aqui.</div>` : `Ainda não há nada aqui.`;
  empty.style.display = (t || secao) && !list.length ? "block" : "none";
}
$("voltar").onclick = () => ir("");
q.oninput = paint; lerHash(); paint();
window.addEventListener("popstate", () => { lerHash(); paint(); });
window.addEventListener("hashchange", () => { lerHash(); paint(); });
</script>
</body>
</html>
