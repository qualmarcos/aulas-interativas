<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aulas Interativas · Intercultura</title>
<meta name="description" content="Aulas interativas de português da Intercultura Costa Rica, Heredia.">
<meta name="theme-color" content="#0d5a3a">
<link rel="icon" href="marca/emblema.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#0d5a3a;--verde2:#1f8f4e;--lima:#a5c21b;--lima2:#c9dc4a;
  --bg:#f3f6f1;--card:#fff;--ink:#16261d;--muted:#5b6b62;--line:#dbe4dc;--soft:#eef4ea;
  --nab1:#006b4f;--nab2:#145da1;--nab3:#6b4598;--via1:#a6462d;
  --sombra:0 10px 30px rgba(13,58,40,.10);--sombra2:0 18px 40px rgba(13,58,40,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block}

/* ---------- Capa ---------- */
header{position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(165,194,27,.35),transparent 60%),
             radial-gradient(900px 600px at -10% 120%,rgba(31,143,78,.55),transparent 60%),
             linear-gradient(135deg,#0a4a30 0%,#0d5a3a 45%,#16784a 100%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:70px;background:var(--bg);
  clip-path:ellipse(75% 100% at 50% 100%)}
.faixa{position:absolute;top:0;bottom:0;right:0;width:clamp(70px,13vw,190px);
  background:url(marca/faixa.jpg) center top/100% auto repeat-y;opacity:.9;
  -webkit-mask:linear-gradient(90deg,transparent,#000 45%);mask:linear-gradient(90deg,transparent,#000 45%)}
.topo{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:22px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topo img{height:clamp(38px,6vw,54px);width:auto}
.hero{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:26px 16px 110px;
  display:grid;grid-template-columns:1.25fr .9fr;align-items:center;gap:32px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--lima2);box-shadow:0 0 0 4px rgba(201,220,74,.25)}
h1{margin:18px 0 12px;font-size:clamp(38px,6.4vw,72px);line-height:1;font-weight:900;letter-spacing:-.02em}
h1 span{display:block;color:var(--lima2)}
.lead{margin:0;max-width:40ch;font-size:clamp(17px,2vw,20px);line-height:1.5;color:rgba(255,255,255,.88)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 16px;min-width:104px;backdrop-filter:blur(4px)}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.05}
.stat small{font-size:13px;color:rgba(255,255,255,.78);font-weight:700}
.selo{position:relative;justify-self:center;width:min(380px,80vw);aspect-ratio:1}
.selo::before{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px dashed rgba(201,220,74,.45);animation:gira 60s linear infinite}
.selo .disco{position:absolute;inset:0;border-radius:50%;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.28),inset 0 0 0 10px #f2f7e6;display:grid;place-items:center}
.selo img{width:84%;height:auto;animation:flutua 6s ease-in-out infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes flutua{50%{transform:translateY(-6px)}}
#bTema{font:inherit;font-size:18px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:7px 11px;cursor:pointer}
#bTema:hover{background:rgba(255,255,255,.24)}

/* ---------- Níveis ---------- */
main{position:relative;z-index:3;max-width:1120px;margin:-86px auto 40px;padding:0 16px}
.niveis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nivel{--c:var(--verde);position:relative;overflow:hidden;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--card);border:2px solid transparent;border-radius:20px;padding:18px 18px 16px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;gap:2px;transition:transform .18s,box-shadow .18s,border-color .18s}
.nivel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.nivel:hover{transform:translateY(-3px);box-shadow:var(--sombra2)}
.nivel:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
.nivel .n{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nivel .t{font-size:26px;font-weight:900;color:var(--c);line-height:1.1}
.nivel .q{font-size:14px;font-weight:700;color:var(--muted)}
.nivel .num{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:44px;font-weight:900;color:var(--c);opacity:.13}
.nivel.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 16px 34px color-mix(in srgb,var(--c) 40%,transparent)}
.nivel.on .n,.nivel.on .q{color:rgba(255,255,255,.82)}
.nivel.on .t{color:#fff}
.nivel.on .num{color:#fff;opacity:.22}
.nivel.on::before{background:rgba(255,255,255,.35)}

.barra{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 18px}
.barra h2{margin:0;font-size:clamp(22px,3vw,28px);font-weight:900}
.barra h2 small{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-top:2px}
.busca{position:relative;width:min(360px,100%)}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.busca input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;outline:none;transition:border-color .15s}
.busca input:focus{border-color:var(--verde2)}

/* ---------- Cartões ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{--c:var(--verde);background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s;animation:entra .35s both}
.card:hover{transform:translateY(-5px);box-shadow:var(--sombra2)}
.card:focus-visible{outline:3px solid var(--lima);outline-offset:3px}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.card .pic{height:168px;background:#cfd8cf center/cover no-repeat;position:relative}
.card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35))}
.card .tag{position:absolute;z-index:1;left:12px;top:12px;background:var(--c);color:#fff;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.card .rev{position:absolute;z-index:1;right:12px;top:12px;background:#fff;color:var(--c);font-weight:900;font-size:11px;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;border-top:4px solid var(--c)}
.card h3{margin:0;font-size:20px;font-weight:900;line-height:1.2}
.card .sub{color:var(--c);font-weight:800}
.card .gram{color:var(--muted);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card .chips span{background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.card .go{margin-top:auto;padding-top:12px;font-weight:900;color:var(--c);display:flex;align-items:center;gap:6px}
.card .go b{transition:transform .18s}
.card:hover .go b{transform:translateX(4px)}
.empty{text-align:center;color:var(--muted);display:none;padding:30px 0;font-weight:700}

footer{max-width:1120px;margin:0 auto;padding:30px 16px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer img{height:40px;width:auto}
footer .logo-b{display:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;text-align:center;padding-bottom:100px}
  .lead{margin:0 auto}.stats{justify-content:center}
  .selo{grid-row:1;width:min(220px,58vw)}
  .niveis{grid-template-columns:repeat(2,1fr)}
  .faixa{opacity:.35}
}
@media (max-width:420px){.nivel .t{font-size:22px}.nivel .num{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Modo escuro ---------- */
html[data-theme="dark"]{color-scheme:dark;--bg:#0e1612;--card:#17221c;--ink:#e4ede6;--muted:#9fb3a6;--line:#2b3b31;--soft:#22312a;
  --nab1:#3fbf8f;--nab2:#6aa8ea;--nab3:#b18ce6;--via1:#ec8a6b;--sombra:0 10px 30px rgba(0,0,0,.4);--sombra2:0 18px 40px rgba(0,0,0,.55)}
html[data-theme="dark"] header{background:radial-gradient(1200px 500px at 85% -10%,rgba(165,194,27,.18),transparent 60%),linear-gradient(135deg,#062a1b,#0a3d28 50%,#0f5134)}
html[data-theme="dark"] .faixa{opacity:.5}
html[data-theme="dark"] .selo .disco{background:#f4f8ee}
html[data-theme="dark"] .nivel.on{color:#0e1612}
html[data-theme="dark"] .nivel.on .t,html[data-theme="dark"] .nivel.on .num{color:#0e1612}
html[data-theme="dark"] .nivel.on .n,html[data-theme="dark"] .nivel.on .q{color:rgba(14,22,18,.75)}
html[data-theme="dark"] .card .tag{color:#0e1612}
html[data-theme="dark"] .card .rev{background:#0e1612}
html[data-theme="dark"] footer .logo-c{display:none}
html[data-theme="dark"] footer .logo-b{display:block}
</style>
<script src="tema.js?v=1"></script>
</head>
<body>
<header>
  <div class="faixa" aria-hidden="true"></div>
  <div class="topo" data-tema>
    <img src="marca/logo-intercultura-branco.png" alt="Intercultura Costa Rica · Centro de Idiomas" width="380" height="124">
  </div>
  <div class="hero">
    <div>
      <div class="eyebrow"><i></i>Classes de Português · Heredia</div>
      <h1>Aulas <span>interativas</span></h1>
      <p class="lead">Escolha o nível e a aula para projetar na sala. Os alunos participam pelo celular com um QR.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="selo"><div class="disco"><img src="marca/emblema.png" alt="Classes de Português" width="480" height="480"></div></div>
  </div>
</header>
<main>
  <div class="niveis" id="tabs" role="tablist" aria-label="Níveis"></div>
  <div class="barra">
    <h2 id="titulo">Aulas</h2>
    <label class="busca">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="Buscar aula ou tema…" aria-label="Buscar aula">
    </label>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Nenhuma aula encontrada.</p>
</main>
<footer>
  <div>
    <img class="logo-c" src="marca/logo-intercultura-cor.png" alt="Intercultura Costa Rica" width="236" height="76">
    <img class="logo-b" src="marca/logo-intercultura-branco.png" alt="Intercultura Costa Rica" width="380" height="124">
  </div>
  <div>www.interculturaheredia.com</div>
</footer>
<script src="aulas-geradas.js?v=1"></script>
<script>
const AULAS = (window.AULAS_GERADAS || []).concat([
  { dir: "nab3-unidade5/", level: "nab3", unit: 5, tag: "NAB3 · Unidade 5", title: "Escolhas, contas e boas conversas",
    sub: "🧺 Dinheiro, orçamento e a Paraíba", img: "nab3-unidade5/img/mercado.jpg",
    gram: "Ler valores em reais · Cédulas e fauna · Orçamento · Conectores com subjuntivo: caso, contanto que, para que, embora, antes que, até que, sem que · Procuro alguém que…",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Artesanato", "Forca", "Equipes"] },
  { dir: "nab3-unidade4/", level: "nab3", unit: 4, tag: "NAB3 · Unidade 4", title: "O tempo muda, a conversa continua",
    sub: "🌦️ Tempo, planos e o Amapá", img: "nab3-unidade4/img/marabaixo.jpg",
    gram: "Tempo × clima · Faz calor, está nublado, chove · Preferência e desejo · É possível que… / É importante que… + subjuntivo",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Marabaixo", "Forca", "Equipes"] },
  { dir: "via-brasil1-unidade2/", level: "via1", unit: 2, tag: "VIA Brasil 1 · Unidade 2", title: "Mensagens, desejos e jeitos de dizer",
    sub: "💬 Interjeições, subjuntivo e expressões", img: "via-brasil1-unidade2/img/celular.jpg",
    gram: "Presente e imperfeito do subjuntivo · Colocação pronominal · Formação de palavras · Superlativo · Regência · Sons do X",
    chips: ["📱 Sala com QR", "💰 Quanto você tem?", "Forca", "Equipes"] },
  { dir: "nab2-unidade3/", level: "nab2", unit: 3, tag: "NAB2 · Unidade 3", title: "Escolhas que vestem o futuro",
    sub: "🧳 Roupas, compras e planos", img: "nab2-unidade3/img/mala.jpg",
    gram: "Futuro do presente · Futuro do pretérito · Verbos vestir, pôr, ir e vir",
    chips: ["📱 Sala com QR", "Galeria", "Memória", "Forca", "Equipes"] },
]);
/* Níveis do menu: [id, nome, legenda]. Cada aula em AULAS indica o seu em "level" e a ordem em "unit". */
const NIVEIS = [["nab1", "NAB1", "Nível 1"], ["nab2", "NAB2", "Nível 2"], ["nab3", "NAB3", "Nível 3"], ["via1", "VIA 1", "VIA Brasil"]];
const KEY = "aulas-nivel", ids = NIVEIS.map(n => n[0]);
const grid = document.getElementById("grid"), q = document.getElementById("q"), tabs = document.getElementById("tabs");
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
const fromHash = location.hash.slice(1);
let nivel = ids.includes(fromHash) ? fromHash : ids.includes(saved) ? saved : ids.find(id => AULAS.some(a => a.level === id));
const count = id => AULAS.filter(a => a.level === id).length;
const isRev = a => /Revis/.test(a.tag);
const stat = (n, t) => `<div class="stat"><b>${n}</b><small>${t}</small></div>`;
document.getElementById("stats").innerHTML = stat(AULAS.length, "aulas") + stat(NIVEIS.length, "níveis") + stat(AULAS.filter(isRev).length, "revisões");
function choose(id) {
  nivel = id; q.value = "";
  try { localStorage.setItem(KEY, id); } catch (e) {}
  history.replaceState(null, "", "#" + id);
  paint();
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function paint() {
  const t = norm(q.value.trim());
  tabs.innerHTML = NIVEIS.map(([id, nome, leg], i) => {
    const on = !t && id === nivel, n = count(id);
    return `<button class="nivel${on ? " on" : ""}" style="--c:var(--${id})" role="tab" aria-selected="${on}" data-id="${id}">
      <span class="n">${leg}</span><span class="t">${nome}</span><span class="q">${n} ${n === 1 ? "aula" : "aulas"}</span><span class="num" aria-hidden="true">${i + 1}</span></button>`;
  }).join("");
  tabs.querySelectorAll(".nivel").forEach(b => b.onclick = () => choose(b.dataset.id));
  const list = AULAS.filter(a => t ? norm([a.tag, a.title, a.sub, a.gram, ...a.chips].join(" ")).includes(t) : a.level === nivel)
    .sort((a, b) => ids.indexOf(a.level) - ids.indexOf(b.level) || a.unit - b.unit);
  const nv = NIVEIS[ids.indexOf(nivel)];
  document.getElementById("titulo").innerHTML = t
    ? `Resultados<small>${list.length} ${list.length === 1 ? "aula encontrada" : "aulas encontradas"}</small>`
    : `${nv[1]}<small>${nv[2]} · ${list.length} ${list.length === 1 ? "aula" : "aulas"}</small>`;
  grid.innerHTML = list.map((a, i) => `<a class="card" href="${a.dir}" style="--c:var(--${a.level});animation-delay:${Math.min(i, 12) * 30}ms">
    <div class="pic" style="background-image:url('${a.img}')"><span class="tag">${a.tag}</span>${isRev(a) ? '<span class="rev">Revisão</span>' : ""}</div>
    <div class="body"><h3>${a.title}</h3><div class="sub">${a.sub}</div><div class="gram">${a.gram}</div>
    <div class="chips">${a.chips.map(c => `<span>${c}</span>`).join("")}</div><div class="go">Abrir aula <b>→</b></div></div></a>`).join("");
  const empty = document.getElementById("empty");
  empty.textContent = t ? "Nenhuma aula encontrada." : `Ainda não há aulas de ${nv[1]}.`;
  empty.style.display = list.length ? "none" : "block";
}
q.oninput = paint; paint();
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (ids.includes(id)) choose(id); });
</script>
</body>
</html>
